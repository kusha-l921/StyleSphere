

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dress Product Detail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="Shop Logo" height="40"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="product-detail">
            <div class="product-image">
                <img src="images/floral-dress.jpg" alt="Floral Summer Dress" width="350">
            </div>
            <div class="product-info">
                <h1>Floral Summer Dress</h1>
                <p class="price">$49.99</p>
                <p class="description">
                    Embrace the season with this beautiful floral summer dress, crafted from lightweight, breathable fabric. Perfect for picnics, beach days, and casual outings.
                </p>
                <div class="tags">
                    <span class="tag">#summer</span>
                    <span class="tag">#floral</span>
                    <span class="tag">#dress</span>
                    <span class="tag">#casual</span>
                </div>
                <button class="add-to-cart"
                        data-name="Floral Summer Dress"
                        data-price="49.99">
                    Add to Cart
                </button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
