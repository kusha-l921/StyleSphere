

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="logo.png" alt="Site Logo"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="product-detail">
            <div class="product-image">
                <img src="product1.jpg" alt="Product Name">
            </div>
            <div class="product-info">
                <h1 class="product-name">Product Name</h1>
                <p class="product-description">
                    This is a detailed description of the product. It highlights the features, benefits, and other important information customers need to know before making a purchase.
                </p>
                <div class="product-price">
                    $49.99
                </div>
                <button class="add-to-cart" id="addToCartBtn">Add to Cart</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
